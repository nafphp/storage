name: NAF Storage Plugin

on:
  push:
    branches: [main, 'v*-rc']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo, mbstring, pdo
          coverage: none
      - run: composer validate --strict
      # The PHP 8.5 lock contains PHPUnit 12; PHP 8.3 resolves supported PHPUnit 11.
      - if: matrix.php == '8.5'
        run: composer install --prefer-dist --no-progress
      - if: matrix.php != '8.5'
        run: composer update --prefer-dist --no-progress
      - run: composer test
