name: NAF Storage Plugin

on:
  push:
    branches: [main, 'v*-rc']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, mbstring, pdo
          coverage: none
      - run: composer validate --strict
      # The PHP 8.5 lock contains PHPUnit 12; PHP 8.3 resolves supported PHPUnit 11.
      - if: matrix.php == '8.5'
        run: composer install --prefer-dist --no-progress
      - if: matrix.php != '8.5'
        run: composer update --prefer-dist --no-progress
      - run: composer test

  remote-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
    steps:
      - uses: actions/checkout@v7
      # Test-only prerequisite until naf/client 0.2.2 is released. This does not
      # add a development/path repository to the package's Composer manifest.
      - uses: actions/checkout@v7
        with:
          repository: nafphp/client
          ref: e30b3462a8b4cb8a6d647f2b5516a9f060d54d13
          path: .test-client
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, mbstring, pdo
          coverage: none
      - run: composer update --prefer-dist --no-progress
      - run: sh tests/remotes.sh "$GITHUB_WORKSPACE/.test-client"
